name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: host
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            host/package-lock.json
            relay/package-lock.json
      - name: Install locked dependencies
        # Host relay integration tests import the relay package from ../relay.
        run: |
          npm ci
          npm ci --prefix ../relay
      - name: Compile host
        run: npm run build
      - name: Test host public boundaries
        run: npm test

  host-windows:
    name: Host / Windows / Node 24
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            host/package-lock.json
            relay/package-lock.json
      - name: Install locked dependencies and test host
        working-directory: host
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          # Host relay integration tests import the relay package from ../relay.
          npm ci --prefix ../relay
          if ($LASTEXITCODE -ne 0) { throw 'relay npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Host tests failed' }

  android:
    name: Android / JDK 21 / API 36
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate official Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # yes may receive SIGPIPE after sdkmanager exits; preserve sdkmanager's status.
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build, unit-test and lint
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease
      - name: Upload JVM test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-test-results
          path: android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
